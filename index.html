<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperRazor.ai - Next-Gen AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            padding: 20px;
        }
        .container {
            padding: 2rem;
            max-width: 600px;
            z-index: 10;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        .chat-box {
            display: none;
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin-top: 2rem;
            flex-direction: column;
            height: 350px;
            text-align: left;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
        }
        .msg.bot { background: #334155; color: #f8fafc; align-self: flex-start; }
        .msg.user { background: #4f46e5; color: white; align-self: flex-end; }
        .chat-input-area { display: flex; padding: 10px; background: rgba(15, 23, 42, 0.6); }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 8px 12px; }
        .chat-input-area input:focus { outline: none; }
        .chat-input-area button { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SuperRazor.ai</h1>
        <p>Asisten AI masa depan yang siap membantu kebutuhan kamu dengan kecepatan kilat.</p>
        <button class="btn" id="startBtn" onclick="aktifkanChat()">Coba Sekarang</button>
        
        <div class="chat-box" id="chatBox">
            <div class="chat-messages" id="chatMessages">
                <div class="msg bot">Halo! Saya SuperRazor.ai. Ada yang bisa saya bantu? ⚡</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Ketik pesan di sini..." onkeypress="handleKeyPress(event)">
                <button onclick="kirimPesan()">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        function aktifkanChat() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('chatBox').style.display = 'flex';
        }
        function kirimPesan() {
            let input = document.getElementById('userInput');
            let text = input.value.trim();
            if (text === "") return;
            let messages = document.getElementById('chatMessages');
            let userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.innerText = text;
            messages.appendChild(userDiv);
            input.value = "";
            messages.scrollTop = messages.scrollHeight;
            setTimeout(() => {
                let botDiv = document.createElement('div');
                botDiv.className = 'msg bot';
                botDiv.innerText = "Sistem SuperRazor.ai aktif! Modul AI utama sedang sinkronisasi server. 🚀";
                messages.appendChild(botDiv);
                messages.scrollTop = messages.scrollHeight;
            }, 1000);
        }
        function handleKeyPress(e) { if (e.key === 'Enter') kirimPesan(); }
    </script>
</body>
</html>
