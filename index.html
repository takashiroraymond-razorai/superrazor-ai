<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperRazor.ai - Next-Gen AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            padding: 20px;
        }
        .container {
            padding: 2rem;
            max-width: 600px;
            z-index: 10;
            transition: all 0.5s ease;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.4);
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #6366f1;
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(79, 70, 229, 0.6);
        }
        .chat-box {
            display: none;
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin-top: 2rem;
            flex-direction: column;
            height: 350px;
            text-align: left;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .msg.bot {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
        }
        .msg.user {
            background: #4f46e5;
            color: white;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 8px 12px;
            font-size: 0.95rem;
        }
        .chat-input-area input:focus {
            outline: none;
        }
        .chat-input-area button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: 20%;
            left: 20%;
            animation: float 6s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container" id="mainContainer">
        <h1>SuperRazor.ai</h1>
        <p>Asisten AI masa depan yang siap membantu segala kebutuhan digital, coding, dan produktivitas kamu dengan kecepatan kilat.</p>
        <button class="btn" id="startBtn" onclick="aktifkanChat()">Coba Sekarang</button>
        
        <div class="chat-box" id="chatBox">
            <div class="chat-messages" id="chatMessages">
                <div class="msg bot">Halo! Saya SuperRazor.ai. Coba tanyakan sesuatu ke saya! ⚡</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Ketik halo, siapa penciptamu, atau tes..." onkeypress="handleKeyPress(event)">
                <button onclick="kirimPesan()">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        function aktifkanChat() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('chatBox').style.display = 'flex';
        }

        function kirimPesan() {
            let inputField = document.getElementById('userInput');
            let pesanText = inputField.value.trim();
            if (pesanText === "") return;

            let chatMessages = document.getElementById('chatMessages');

            // 1. Tampilkan pesan user
            let userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.innerText = pesanText;
            chatMessages.appendChild(userDiv);
            
            inputField.value = ""; 
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // 2. Sistem Logika Berpikir AI SuperRazor
            setTimeout(() => {
                let botDiv = document.createElement('div');
                botDiv.className = 'msg bot';
                
                // Mengubah pesan input jadi huruf kecil semua biar deteksinya gampang
                let kataKunci = pesanText.toLowerCase();
                let balasanAI = "";

                if (kataKunci.includes("halo") || kataKunci.includes("hai") || kataKunci.includes("p ")) {
                    balasanAI = "Halo juga! Ada yang bisa SuperRazor bantu hari ini? 😎";
                } else if (kataKunci.includes("pencipta") || kataKunci.includes("bikin") || kataKunci.includes("developer")) {
                    balasanAI = "Saya diciptakan oleh seorang Developer keren pemilik laptop Asus berkecepatan tinggi! 💻🚀";
                } else if (kataKunci.includes("game") || kataKunci.includes("minecraft")) {
                    balasanAI = "Waduh kalau soal game, pesan dari pencipta saya: Jangan download yang crack lagi ya, ngeri Trojan! 👾😂";
                } else if (kataKunci.includes("tes") || kataKunci.includes("uji")) {
                    balasanAI = "Sistem berjalan 100% lancar, Bos! Respon server aman dan terkendali. 🟢";
                } else {
                    balasanAI = "Menarik sekali! Sayangnya modul kognitif penuh saya masih dikembangkan. Tapi tenang, kodingan ini terbukti sukses jalan! 🚀";
                }

                botDiv.innerText = balasanAI;
                chatMessages.appendChild(botDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 800);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                kirimPesan();
            }
        }
    </script>
</body>
</html>
