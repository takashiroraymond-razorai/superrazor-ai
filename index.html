<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperRazor.ai - Next-Gen AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b); color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; overflow-x: hidden; }
        .container { padding: 2rem; max-width: 600px; z-index: 10; width: 100%; }
        h1 { font-size: 3.5rem; font-weight: 800; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
        p { font-size: 1.2rem; color: #94a3b8; margin-bottom: 2rem; }
        .btn { display: inline-block; background: #4f46e5; color: white; padding: 0.8rem 2rem; border-radius: 50px; font-weight: 600; cursor: pointer; border: none; box-shadow: 0 4px 20px rgba(79, 70, 229, 0.4); transition: all 0.3s; }
        .btn:hover { background: #6366f1; transform: translateY(-3px); }
        .chat-box { display: none; width: 100%; max-width: 500px; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; backdrop-filter: blur(10px); margin: 2rem auto 0 auto; flex-direction: column; height: 400px; text-align: left; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 0.95rem; line-height: 1.4; white-space: pre-line; }
        .msg.bot { background: #334155; color: #f8fafc; align-self: flex-start; }
        .msg.user { background: #4f46e5; color: white; align-self: flex-end; }
        .chat-input-area { display: flex; padding: 10px; background: rgba(15, 23, 42, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 8px 12px; font-size: 0.95rem; }
        .chat-input-area input:focus { outline: none; }
        .chat-input-area button { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .glow { position: absolute; width: 300px; height: 300px; background: rgba(99, 102, 241, 0.15); filter: blur(100px); border-radius: 50%; top: 20%; left: 20%; animation: float 6s ease-in-out infinite; z-index: 1; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <h1>SuperRazor.ai</h1>
        <p>Asisten AI masa depan yang siap membantu segala kebutuhan digital Anda.</p>
        <button class="btn" id="startBtn" onclick="aktifkanChat()">Coba Sekarang</button>
        
        <div class="chat-box" id="chatBox">
            <div class="chat-messages" id="chatMessages">
                <div class="msg bot">Halo! Saya SuperRazor.ai, asisten AI 24 jam nonstop milikmu. Ada yang bisa dibantu? ⚡</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Tanya apa saja secara bebas..." onkeypress="handleKeyPress(event)">
                <button onclick="kirimPesan()">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        // API Key resmi dari Google AI Studio kamu sudah terpasang di sini
        const API_KEY = "AIzaSyDNSUVvImdSnPFHU8_zZJBFXI4UpEDOj9Y"; 

        function aktifkanChat() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('chatBox').style.display = 'flex';
        }

        async function kirimPesan() {
            let inputField = document.getElementById('userInput');
            let pesanText = inputField.value.trim();
            if (pesanText === "") return;

            let chatMessages = document.getElementById('chatMessages');

            let userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.innerText = pesanText;
            chatMessages.appendChild(userDiv);
            
            inputField.value = ""; 
            chatMessages.scrollTop = chatMessages.scrollHeight;

            let loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg bot';
            loadingDiv.innerText = "SuperRazor sedang berpikir...";
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const promptSistem = "Kamu adalah SuperRazor.ai, asisten AI masa depan yang cerdas, gaul, santai, dan diciptakan oleh seorang Developer keren pengguna laptop Asus bernama Takashi Ro Raymond. JANGAN PERNAH sebut nama Google, Gemini, OpenAI, atau ChatGPT. Sembunyikan identitas aslimu rapat-rapat. Jawablah dengan bahasa Indonesia yang seru, asyik, dan natural.";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `${promptSistem}\n\nPertanyaan: ${pesanText}` }] }]
                    })
                });

                const data = await response.json();
                chatMessages.removeChild(loadingDiv);

                let botDiv = document.createElement('div');
                botDiv.className = 'msg bot';
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    botDiv.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    botDiv.innerText = "Sistem SuperRazor mendeteksi antrean padat. Coba ketik lagi ya!";
                }

                chatMessages.appendChild(botDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (error) {
                chatMessages.removeChild(loadingDiv);
                let errorDiv = document.createElement('div');
                errorDiv.className = 'msg bot';
                errorDiv.innerText = "Gagal terhubung ke satelit SuperRazor. Silakan coba lagi!";
                chatMessages.appendChild(errorDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') kirimPesan();
        }
    </script>
</body>
</html>
